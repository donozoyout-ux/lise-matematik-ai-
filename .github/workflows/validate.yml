name: Validate app
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node --check src/worker.mjs
      - run: node --check public/math-board.js
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/math-worker-check
